<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mid TN Volleyball — Dashboard Mind Map</title>
  <style>
    body { margin: 0; padding: 24px; background: #f9f7f3; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }

    p  { font-size: 12px; color: #888; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 20px; }
    svg { width: 100%; max-width: 720px; }
  </style>
</head>
<body>
  <h1>Mid TN Volleyball</h1>
  <p>Club Management Dashboard — System Overview</p>

  <svg viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg">

    <!-- Connector lines -->
    <line x1="340" y1="290" x2="340" y2="100"  stroke="#c0bfb8" stroke-width="0.5" stroke-dasharray="5 4"/>

    <!-- Center hub -->
    <rect x="274" y="260" width="132" height="60" rx="30" fill="#F0997B" stroke="#D85A30" stroke-width="1.2"/>

    <text x="340" y="304" text-anchor="middle" font-size="11" fill="#993C1D" font-family="sans-serif">Mid TN Volleyball</text>

    <rect x="270" y="74" width="140" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>

    <text x="80" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C" font-family="sans-serif">VOLLEY AI</text>
    <text x="80" y="304" text-anchor="middle" font-size="11" fill="#534AB7" font-family="sans-serif">Club AI agent</text>

    <rect x="128" y="132" width="140" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="198" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C" font-family="sans-serif">Financials</text>
    <text x="198" y="172" text-anchor="middle" font-size="11" fill="#534AB7" font-family="sans-serif">Dues &amp; budgets</text>

    <!-- Legend -->
    <rect x="130" y="544" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="146" y="549" dominant-baseline="central" font-size="11" fill="#888" font-family="sans-serif">Admin &amp; systems</text>
    <rect x="285" y="544" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="301" y="549" dominant-baseline="central" font-size="11" fill="#888" font-family="sans-serif">Athletes &amp; coaching</text>
    <rect x="450" y="544" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="466" y="549" dominant-baseline="central" font-size="11" fill="#888" font-family="sans-serif">Events &amp; community</text>

</html>
