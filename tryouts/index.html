// ── UTILS ───────────────────────────────────────────────────────────
let toCounter = 200;
function nextTO(existing){
  const used=new Set(existing.map(a=>Number(a.to)));
  while(used.has(toCounter)) toCounter++;
  return String(toCounter++);
}
function classifyPos(pos){
  if(!pos) return "unsorted";
  const p=pos.toLowerCase().trim();
  for(const c of POS_CATS) if(c.abbrs.some(a=>p===a||p.includes(a))) return c.key;
  return "unsorted";
}
function posAbbr(pos){
  if(!pos) return "---";
  const p=pos.toLowerCase().trim();
  if(p.includes("setter")||p==="s") return "S";
  if(p.includes("middle")||p==="mb"||p==="m") return "M";
  if(p.includes("outside")||p==="oh") return "OH";
  if(p.includes("right side")||p==="rs") return "RS";
  if(p.includes("defensive")||p==="ds") return "DS";
  if(p.includes("libero")||p==="l") return "L";
  if(p.includes("unsure")) return "?";
  return pos.substring(0,3).toUpperCase();
}
function divAge(div){const m=(div||"").match(/(\d+)/);return m?m[1]:null;}
function stationAvg(metrics,key){
  const v=((metrics||{})[key]||[]).filter(x=>x!==""&&x!==null&&!isNaN(Number(x))).map(Number);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
function totalScore(metrics){
  let s=0,c=0;
  ["station1","station2","station3"].forEach(k=>{const a=stationAvg(metrics,k);if(a!==null){s+=a;c++;}});
  return c>0?(s/c).toFixed(1):null;
}
function initAthletes(raw){
  let n=100;
  return raw.filter(a=>a.first).map(a=>({
    ...a,
    id: a.id||`${a.first}-${a.last}-${Math.random().toString(36).substr(2,5)}`,
    to: a.to||String(n++),
    ageGroup: divAge(a.division)||"",
    posCategory: classifyPos(a.primaryPos),
    status: a.status||"pending",
    teamAssignment: a.teamAssignment||null,
    teamLocked: a.teamLocked||false,
    coachPos: a.coachPos||"",
    hidden: a.hidden||false,
    hideReason: a.hideReason||"",
    hideNote: a.hideNote||"",
    isWalkup: a.isWalkup||false,
    arrived: a.arrived||false,
    notes: a.notes||"",
    wontAccept: a.wontAccept||"",
    metrics: a.metrics||{},
    rank: a.rank||null,
  }));
}
function saveLocal(a){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(a));}catch(e){}}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||"null");}catch(e){return null;}}

// ── EXPORT ─────────────────────────────────────────────────────────
function exportTeamsCSV(athletes){
  const rows=[["Age Group","Team","TO#","First","Last","Position","Coach Pos","Score","Status","Phone","Email","Notes"]];
  AGE_GROUPS.forEach(age=>{
    SKILL_LEVELS.forEach(lvl=>{
      const key=`${age}-${lvl}`;
      athletes.filter(a=>a.teamAssignment===key&&!a.hidden).forEach(a=>{
        rows.push([age+"s",key,a.to,a.first,a.last,a.primaryPos,a.coachPos,totalScore(a.metrics)||"",a.status,a.phone,a.email,a.notes]);
      });
    });
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="MidTN_VBC_Teams.csv";a.click();URL.revokeObjectURL(url);
}
function exportAllRegCSV(athletes){
  const rows=[["TO#","First","Last","Division","Primary Pos","Alt Pos","Coach Pos","Score","S1 Avg","S2 Avg","S3 Avg","Status","Arrived","Walkup","Phone","Email","Notes"]];
  athletes.filter(a=>!a.hidden).forEach(a=>{
    rows.push([a.to,a.first,a.last,a.division,a.primaryPos,a.altPos,a.coachPos,totalScore(a.metrics)||"",
      stationAvg(a.metrics,"station1")?.toFixed(1)||"",stationAvg(a.metrics,"station2")?.toFixed(1)||"",stationAvg(a.metrics,"station3")?.toFixed(1)||"",
      a.status,a.arrived?"Yes":"",a.isWalkup?"Yes":"",a.phone,a.email,a.notes]);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");link.href=url;link.download="MidTN_VBC_Registration.csv";link.click();URL.revokeObjectURL(url);
}

function Badge({c="#4fc3f7",bg,children,sm}){
  return <span style={{display:"inline-block",padding:sm?"1px 6px":"2px 8px",borderRadius:4,fontSize:sm?10:11,fontWeight:700,letterSpacing:.4,background:bg||c+"22",color:c,border:`1px solid ${c}44`,textTransform:"uppercase",whiteSpace:"nowrap"}}>{children}</span>;
}
function StatusBadge({status}){
  const m={pending:{c:"#78909c",l:"Pending"},arrived:{c:"#26c6da",l:"Arrived"},contacted:{c:"#ffa726",l:"Contacted"},offered:{c:"#42a5f5",l:"Offered"},accepted:{c:"#66bb6a",l:"Accepted"},declined:{c:"#ef5350",l:"Declined"},info_requested:{c:"#ab47bc",l:"Info Req."}};
  const s=m[status]||m.pending;
  return <Badge c={s.c}>{s.l}</Badge>;
}
function Btn({children,onClick,color="#1565c0",outline,sm,disabled,style:sx,danger, ...props}){
  const c=danger?"#ef5350":color;
  return <button onClick={onClick} disabled={disabled} {...props} style={{padding:sm?"4px 10px":"8px 16px",background:outline?"transparent":c,border:outline?`1px solid ${c}`:"none",borderRadius:6,color:outline?c:"#fff",cursor:disabled?"not-allowed":"pointer",fontSize:sm?11:13,fontWeight:600,opacity:disabled?.5:1,transition:"all .15s",whiteSpace:"nowrap",...sx}}>{children}</button>;
}

// ── LOGIN ───────────────────────────────────────────────────────────
function Login({onLogin}){
  const [pin,setPin]=useState("");
  const [err,setErr]=useState("");
  const go=()=>{
    if(pin===HC_PIN){onLogin({role:"hc"});return;}
    const s=STATIONS.find(x=>x.pin===pin);
    if(s){onLogin({role:"station",station:s.key,label:s.label,isCheckin:s.isCheckin});return;}
    setErr("Invalid PIN");setPin("");
  };
  return(
    <div style={{minHeight:"100vh",background:"#0d1017",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#1a1d24",border:"1px solid #2a2e38",borderRadius:16,padding:40,width:380,textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:10}} role="img" aria-label="Volleyball">🏐</div>
        <h1 style={{margin:"0 0 4px",fontSize:26,fontWeight:800}}><span style={{color:"#f0a500"}}>MID TN</span> VBC</h1>
        <p style={{color:"#78909c",fontSize:13,margin:"0 0 6px"}}>Tryout Manager v2 · 2026–2027</p>
        <a href="../" style={{display:"block",fontSize:12,color:"#4fc3f7",marginBottom:24}}>← Back to Hub</a>
        <input value={pin} onChange={e=>{setPin(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&go()}
          type="password" placeholder="Enter PIN" maxLength={6}
          style={{width:"100%",padding:"12px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:8,color:"#e8eaed",fontSize:20,textAlign:"center",letterSpacing:10,marginBottom:10}}/>
        {err&&<p style={{color:"#ef5350",fontSize:13,margin:"0 0 10px"}}>{err}</p>}
        <button onClick={go} style={{width:"100%",padding:12,background:"#f0a500",border:"none",borderRadius:8,color:"#000",fontSize:15,fontWeight:800,cursor:"pointer",marginBottom:20}}>Log In →</button>
        <div style={{borderTop:"1px solid #2a2e38",paddingTop:14,fontSize:11,color:"#546e7a"}}>
          <div style={{fontWeight:700,marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>PINs</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,textAlign:"left",marginBottom:6}}>
            <div>Check-In: <span style={{color:"#26c6da",fontFamily:"monospace"}}>9999</span></div>
            <div>Station 1: <span style={{color:"#f0a500",fontFamily:"monospace"}}>1111</span></div>
            <div>Station 2: <span style={{color:"#f0a500",fontFamily:"monospace"}}>2222</span></div>
            <div>Station 3: <span style={{color:"#f0a500",fontFamily:"monospace"}}>3333</span></div>
          </div>
          <div>Head Coach: <span style={{color:"#ef5350",fontFamily:"monospace"}}>0000</span></div>
        </div>
      </div>
    </div>
  );
}

// ── CHECK-IN STATION ─────────────────────────────────────────────────
function CheckInStation({athletes,onArrive,onAddWalkup,onLogout}){
  const [search,setSearch]=useState("");
  const [walkupMode,setWalkupMode]=useState(false);
  const [wu,setWu]=useState({first:"",last:"",dob:"",division:"12 & Under",primaryPos:"Outside Hitter",altPos:"",phone:"",email:""});
  const [recentArrivals,setRecentArrivals]=useState([]);
  const inp=useRef();
  useEffect(()=>{inp.current?.focus();},[walkupMode]);

  const found=useMemo(()=>{
    const s=search.trim().toLowerCase();
    if(!s) return [];
    return athletes.filter(a=>!a.hidden&&(a.first.toLowerCase().includes(s)||a.last.toLowerCase().includes(s)||a.to.includes(search.trim())));
  },[search,athletes]);

  const markArrived=(a)=>{
    onArrive(a.id);
    setRecentArrivals(p=>[{...a,arrived:true},...p.filter(x=>x.id!==a.id)].slice(0,8));
    setSearch("");
  };
  const submitWalkup=()=>{
    if(!wu.first||!wu.last) return;
    const to=nextTO(athletes);
    onAddWalkup({...wu,to,isWalkup:true,arrived:true,status:"arrived",id:`wu-${Date.now()}`});
    setRecentArrivals(p=>[{...wu,to,isWalkup:true},...p].slice(0,8));
    setWu({first:"",last:"",dob:"",division:"12 & Under",primaryPos:"Outside Hitter",altPos:"",phone:"",email:""});
    setWalkupMode(false);
  };

  const arrived=athletes.filter(a=>a.arrived&&!a.hidden).length;
  const total=athletes.filter(a=>!a.hidden).length;

  return(
    <div style={{minHeight:"100vh",background:"#0d1017"}}>
      <div style={{background:"#1a1d24",borderBottom:"1px solid #1e222b",padding:"14px 24px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <h1 style={{margin:0,fontSize:20,fontWeight:800,color:"#26c6da"}}>Check-In Station</h1>
          <p style={{margin:0,fontSize:12,color:"#546e7a"}}>Mid TN VBC Tryouts 2026-2027</p>
        </div>
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:28,fontWeight:800,color:"#26c6da"}}>{arrived}</div>
            <div style={{fontSize:10,color:"#546e7a",textTransform:"uppercase"}}>Arrived / {total}</div>
          </div>
          <Btn sm onClick={()=>setWalkupMode(true)} color="#f0a500">+ Walkup</Btn>
          <Btn sm onClick={onLogout} color="#ef5350" outline>Log Out</Btn>
        </div>
      </div>

      <div style={{maxWidth:580,margin:"0 auto",padding:24}}>
        {!walkupMode?(
          <>
            <div style={{background:"#1a1d24",border:"1px solid #2a2e38",borderRadius:12,padding:20,marginBottom:20}}>
              <label style={{fontSize:11,color:"#78909c",display:"block",marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>Search by name or TO#</label>
              <input ref={inp} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Type name or TO#..." autoFocus
                style={{width:"100%",padding:"12px 16px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:8,color:"#e8eaed",fontSize:18}}/>
              {search&&found.length===0&&<div style={{marginTop:8,fontSize:13,color:"#ef5350"}}>No match — is this a walkup?</div>}
            </div>
            {found.length>0&&(
              <div style={{marginBottom:20}}>
                {found.map(a=>(
                  <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px",background:a.arrived?"#0a2010":"#1a1d24",border:`1px solid ${a.arrived?"#66bb6a44":"#2a2e38"}`,borderRadius:10,marginBottom:8}}>
                    <span style={{fontFamily:"monospace",color:"#4fc3f7",fontSize:12}}>#{a.to}</span>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:15}}>{a.first} {a.last}</div>
                      <div style={{fontSize:11,color:"#78909c"}}>{a.division} · {posAbbr(a.primaryPos)}</div>
                    </div>
                    {a.isWalkup&&<Badge c="#ffa726" sm>Walkup</Badge>}
                    {a.arrived
                      ?<Badge c="#66bb6a">✓ Arrived</Badge>
                      :<Btn onClick={()=>markArrived(a)} color="#26c6da" style={{fontSize:14,padding:"8px 20px"}}>Mark Arrived ✓</Btn>}
                  </div>
                ))}
              </div>
            )}
            {recentArrivals.length>0&&(
              <div style={{background:"#12151c",border:"1px solid #1e222b",borderRadius:10,padding:14}}>
                <div style={{fontSize:11,color:"#546e7a",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Recent Check-Ins</div>
                {recentArrivals.map((a,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid #1e222b"}}>
                    <span style={{fontFamily:"monospace",color:"#4fc3f7",fontSize:11}}>#{a.to}</span>
                    <span style={{flex:1,fontSize:13}}>{a.first} {a.last}</span>
                    <Badge c="#26c6da" sm>✓</Badge>
                    {a.isWalkup&&<Badge c="#ffa726" sm>Walkup</Badge>}
                  </div>
                ))}
              </div>
            )}
          </>
        ):(
          <div style={{background:"#1a1d24",border:"1px solid #f0a50033",borderRadius:12,padding:24}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:20}}>
              <h3 style={{margin:0,color:"#f0a500",fontSize:16}}>Add Walkup Athlete</h3>
              <Btn sm onClick={()=>setWalkupMode(false)} color="#2a2e38">Cancel</Btn>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              {[["First Name","first",true],["Last Name","last",true],["Date of Birth","dob",false],["Phone","phone",false],["Email","email",false]].map(([l,k,req])=>(
                <div key={k} style={{gridColumn:k==="email"?"span 2":"auto"}}>
                  <label style={{fontSize:11,color:"#78909c",display:"block",marginBottom:4}}>{l}{req&&" *"}</label>
                  <input value={wu[k]} onChange={e=>setWu(p=>({...p,[k]:e.target.value}))} placeholder={l}
                    style={{width:"100%",padding:"8px 12px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:6,color:"#e8eaed",fontSize:13}}/>
                </div>
              ))}
              <div>
                <label style={{fontSize:11,color:"#78909c",display:"block",marginBottom:4}}>Division *</label>
                <select value={wu.division} onChange={e=>setWu(p=>({...p,division:e.target.value}))} style={{width:"100%",padding:"8px 12px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:6,color:"#e8eaed",fontSize:13}}>
                  {AGE_GROUPS.map(a=><option key={a} value={`${a} & Under`}>{a} & Under</option>)}
                </select>
              </div>
              <div>
                <label style={{fontSize:11,color:"#78909c",display:"block",marginBottom:4}}>Primary Position *</label>
                <select value={wu.primaryPos} onChange={e=>setWu(p=>({...p,primaryPos:e.target.value}))} style={{width:"100%",padding:"8px 12px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:6,color:"#e8eaed",fontSize:13}}>
                  {["Outside Hitter","Middle Hitter","Setter","Right Side Hitter","Defensive Specialist","Libero","I am unsure"].map(p=><option key={p}>{p}</option>)}
                </select>
              </div>
            </div>
            <Btn onClick={submitWalkup} color="#f0a500" disabled={!wu.first||!wu.last} style={{width:"100%",padding:12,fontSize:15}}>Add Walkup & Check In ✓</Btn>
          </div>
        )}
      </div>
    </div>
  );
}

// ── STATION SCORING ─────────────────────────────────────────────────
function StationView({stationKey,label,athletes,updateMetric,onLogout}){
  const def=STATIONS.find(s=>s.key===stationKey);
  const [toSearch,setToSearch]=useState("");
  const [active,setActive]=useState(null);
  const [recent,setRecent]=useState([]);
  const inp=useRef();

  const found=useMemo(()=>{
    const s=toSearch.trim();
    if(!s) return null;
    return athletes.find(a=>a.to===s&&!a.hidden)||athletes.find(a=>(a.first+" "+a.last).toLowerCase()===s.toLowerCase()&&!a.hidden)||null;
  },[toSearch,athletes]);

  const save=()=>{
    if(active){setRecent(p=>[active,...p.filter(x=>x.id!==active.id)].slice(0,8));setActive(null);setToSearch("");}
    setTimeout(()=>inp.current?.focus(),50);
  };
  const vals=active?((active.metrics&&active.metrics[stationKey])||def.metrics.map(()=>"")):def.metrics.map(()=>"");
  const avg=active?stationAvg(active.metrics,stationKey):null;

  return(
    <div style={{minHeight:"100vh",background:"#0d1017"}}>
      <div style={{background:"#1a1d24",borderBottom:"1px solid #1e222b",padding:"14px 24px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <h1 style={{margin:0,fontSize:20,fontWeight:800,color:"#f0a500"}}>{label}</h1>
          <p style={{margin:0,fontSize:12,color:"#546e7a"}}>Mid TN VBC Tryouts</p>
        </div>
        <Btn sm onClick={onLogout} color="#ef5350" outline>Log Out</Btn>
      </div>
      <div style={{maxWidth:560,margin:"0 auto",padding:24}}>
        <div style={{background:"#1a1d24",border:"1px solid #2a2e38",borderRadius:12,padding:20,marginBottom:16}}>
          <label style={{fontSize:11,color:"#78909c",display:"block",marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>Athlete TO# or Name</label>
          <div style={{display:"flex",gap:8}}>
            <input ref={inp} value={toSearch} onChange={e=>setToSearch(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&found) setActive({...found});}}
              placeholder="TO# or full name" autoFocus
              style={{flex:1,padding:"10px 14px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:8,color:"#e8eaed",fontSize:16,fontFamily:"monospace"}}/>
            <Btn onClick={()=>found&&setActive({...found})} disabled={!found} color="#f0a500">Load</Btn>
          </div>
          {toSearch&&!found&&<div style={{marginTop:6,fontSize:12,color:"#ef5350"}}>Not found</div>}
        </div>

        {active&&(
          <div style={{background:"#1a1d24",border:"1px solid #2a2e38",borderRadius:12,padding:20,marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
              <div>
                <div style={{fontSize:20,fontWeight:800}}>{active.first} {active.last}</div>
                <div style={{fontSize:12,color:"#78909c",marginTop:2,display:"flex",gap:8,flexWrap:"wrap"}}>
                  <span style={{color:"#4fc3f7",fontFamily:"monospace"}}>TO# {active.to}</span>
                  <Badge c="#78909c" sm>{posAbbr(active.primaryPos)}</Badge>
                  {active.altPos&&<Badge c="#546e7a" sm>{posAbbr(active.altPos)}</Badge>}
                  {active.isWalkup&&<Badge c="#ffa726" sm>Walkup</Badge>}
                </div>
              </div>
              {avg!==null&&<div style={{textAlign:"right"}}><div style={{fontSize:11,color:"#78909c"}}>Station Avg</div><div style={{fontSize:28,fontWeight:800,color:"#66bb6a"}}>{avg.toFixed(1)}</div></div>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:`repeat(${def.metrics.length},1fr)`,gap:12,marginBottom:16}}>
              {def.metrics.map((label,idx)=>(
                <div key={idx}>
                  <label style={{fontSize:11,color:"#78909c",display:"block",marginBottom:4}}>{label}</label>
                  <input type="number" value={vals[idx]||""} autoFocus={idx===0}
                    onChange={e=>{const nv=[...vals];nv[idx]=e.target.value;updateMetric(active.id,stationKey,nv);setActive(a=>({...a,metrics:{...a.metrics,[stationKey]:nv}}));}}
                    onKeyDown={e=>{if(e.key==="Enter"&&idx===def.metrics.length-1) save();}}
                    style={{width:"100%",padding:"10px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:8,color:"#e8eaed",fontSize:22,textAlign:"center",fontFamily:"monospace"}}/>
                </div>
              ))}
            </div>
            <Btn onClick={save} color="#66bb6a" style={{width:"100%",padding:12,fontSize:15}}>Save & Next ✓</Btn>
          </div>
        )}

        {recent.length>0&&(
          <div style={{background:"#12151c",border:"1px solid #1e222b",borderRadius:10,padding:14}}>
            <div style={{fontSize:11,color:"#546e7a",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Recent ({recent.length})</div>
            {recent.map(a=>{const av=stationAvg(a.metrics,stationKey);return(
              <div key={a.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid #1e222b"}}>
                <span style={{fontFamily:"monospace",color:"#4fc3f7",fontSize:11}}>#{a.to}</span>
                <span style={{flex:1,fontSize:13}}>{a.first} {a.last}</span>
                {av!==null?<Badge c="#66bb6a">{av.toFixed(1)}</Badge>:<Badge c="#546e7a" sm>—</Badge>}
                <Btn sm onClick={()=>setActive({...a})} color="#4fc3f7" outline>Edit</Btn>
              </div>
            );})}
          </div>
        )}
      </div>
    </div>
  );
}

// ── ATHLETE DETAIL MODAL ─────────────────────────────────────────────
function AthleteModal({athlete,onClose,onChange,onHide,onUnhide,onEmail}){
  if(!athlete) return null;
  const locked=athlete.status==="accepted";
  const sc=totalScore(athlete.metrics);
  const [editField,setEditField]=useState(null);
  const [editVal,setEditVal]=useState("");

  const startEdit=(field,val)=>{if(locked)return;setEditField(field);setEditVal(val||"");};
  const saveEdit=()=>{if(editField){onChange(athlete.id,{[editField]:editVal});setEditField(null);}};
  const field=(label,key,opts)=>(
    <div>
      <div style={{fontSize:11,color:"#78909c",marginBottom:2,textTransform:"uppercase",letterSpacing:.5}}>{label}</div>
      {editField===key
        ?(opts
          ?<select value={editVal} onChange={e=>setEditVal(e.target.value)} onBlur={saveEdit} autoFocus style={{width:"100%",padding:"4px 8px",background:"#12151c",border:"1px solid #4fc3f7",borderRadius:4,color:"#e8eaed",fontSize:13}}>{opts.map(o=><option key={o}>{o}</option>)}</select>
          :<input value={editVal} onChange={e=>setEditVal(e.target.value)} onBlur={saveEdit} onKeyDown={e=>e.key==="Enter"&&saveEdit()} autoFocus style={{width:"100%",padding:"4px 8px",background:"#12151c",border:"1px solid #4fc3f7",borderRadius:4,color:"#e8eaed",fontSize:13}}/>)
        :<div onClick={()=>startEdit(key,athlete[key])} style={{fontSize:13,color:athlete[key]?"#e8eaed":"#444",cursor:locked?"default":"pointer",padding:"2px 0",borderBottom:"1px dashed #2a2e38",wordBreak:"break-all"}}>{athlete[key]||"—"}{!locked&&<span style={{color:"#4fc3f7",marginLeft:4,fontSize:10}}>✏</span>}</div>}
    </div>
  );

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"#000b",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#1a1d24",border:"1px solid #2a2e38",borderRadius:16,padding:28,width:640,maxHeight:"92vh",overflow:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
          <div>
            <h3 style={{margin:0,fontSize:20,color:"#e8eaed",display:"flex",alignItems:"center",gap:8}}>
              {locked&&<span role="img" aria-label="Locked">🔒 </span>}{athlete.first} {athlete.last}
              {athlete.isWalkup&&<Badge c="#ffa726" sm>Walkup</Badge>}
              {athlete.arrived&&<Badge c="#26c6da" sm>✓ Arrived</Badge>}
            </h3>
            <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap",alignItems:"center"}}>
              <span style={{color:"#4fc3f7",fontSize:13,fontFamily:"monospace"}}>TO# {athlete.to}</span>
              {sc&&<Badge c="#66bb6a">Score: {sc}</Badge>}
              <StatusBadge status={athlete.status}/>
              {athlete.wontAccept&&<span title={athlete.wontAccept} style={{cursor:"help"}} role="img" aria-label="Team Restriction Alert">⚠️</span>}
              {athlete.wontAccept&&<span role="img" aria-label="Warning" title={athlete.wontAccept} style={{cursor:"help"}}>⚠️</span>}
            </div>
          </div>
          <button onClick={onClose} aria-label="Close modal" style={{background:"none",border:"none",color:"#666",fontSize:22,cursor:"pointer"}}>×</button>
        </div>

        {/* Info grid */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px 20px",marginBottom:20}}>
          {field("First Name","first")}
          {field("Last Name","last")}
          {field("Date of Birth","dob")}
          {field("Division","division",AGE_GROUPS.map(a=>`${a} & Under`))}
          {field("Primary Position","primaryPos",["Outside Hitter","Middle Hitter","Setter","Right Side Hitter","Defensive Specialist","Libero","I am unsure"])}
          {field("Alt Position","altPos",["Outside Hitter","Middle Hitter","Setter","Right Side Hitter","Defensive Specialist","Libero","N/A"])}
          {field("Phone","phone")}
          {field("Email","email")}
        </div>

        {/* Status + Coach Pos */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:16}}>
          <div>
            <label style={{fontSize:11,color:"#78909c",display:"block",marginBottom:4}}>Status</label>
            <select value={athlete.status} onChange={e=>onChange(athlete.id,{status:e.target.value})} disabled={locked}
              style={{width:"100%",padding:"6px 10px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:6,color:"#e8eaed",fontSize:13,cursor:locked?"not-allowed":"pointer"}}>
              {STATUSES.map(s=><option key={s} value={s}>{s.charAt(0).toUpperCase()+s.slice(1).replace("_"," ")}</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:11,color:"#78909c",display:"block",marginBottom:4}}>Coach POS</label>
            <select value={athlete.coachPos||""} onChange={e=>onChange(athlete.id,{coachPos:e.target.value})} disabled={locked}
              style={{width:"100%",padding:"6px 10px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:6,color:"#e8eaed",fontSize:13}}>
              <option value="">---</option>
              {["S","M","OH","RS","DS","L"].map(p=><option key={p}>{p}</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:11,color:"#78909c",display:"block",marginBottom:4}}>Arrived</label>
            <select value={athlete.arrived?"yes":"no"} onChange={e=>onChange(athlete.id,{arrived:e.target.value==="yes",status:e.target.value==="yes"&&athlete.status==="pending"?"arrived":athlete.status})}
              style={{width:"100%",padding:"6px 10px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:6,color:"#e8eaed",fontSize:13}}>
              <option value="no">Not Arrived</option>
              <option value="yes">Arrived ✓</option>
            </select>
          </div>
        </div>

        {/* Notes */}
        <div style={{marginBottom:16}}>
          <label style={{fontSize:11,color:"#78909c",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}>Notes (calls, observations, coach notes)</label>
          <textarea value={athlete.notes||""} onChange={e=>onChange(athlete.id,{notes:e.target.value})} disabled={locked}
            placeholder="Add call log, tryout notes, parent concerns..." rows={3}
            style={{width:"100%",padding:"8px 12px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:8,color:"#e8eaed",fontSize:13,lineHeight:1.6,resize:"vertical"}}/>
        </div>

        {/* Won't Accept */}
        <div style={{marginBottom:16}}>
          <label style={{fontSize:11,color:"#ffa726",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}><span role="img" aria-label="Alert">⚠️</span> Won't Accept (team restrictions)</label>
          <label style={{fontSize:11,color:"#ffa726",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}><span role="img" aria-label="Warning">⚠️</span> Won't Accept (team restrictions)</label>
          <input value={athlete.wontAccept||""} onChange={e=>onChange(athlete.id,{wontAccept:e.target.value})} disabled={locked}
            placeholder="e.g. Will not accept 14 Silver or lower"
            style={{width:"100%",padding:"8px 12px",background:"#12151c",border:"1px solid #ffa72633",borderRadius:8,color:"#e8eaed",fontSize:13}}/>
        </div>

        {/* Metrics */}
        <div style={{borderTop:"1px solid #2a2e38",paddingTop:16,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:"#4fc3f7",marginBottom:10}}>Tryout Scores</div>
          {STATIONS.filter(s=>!s.isCheckin).map(station=>{
            const vs=(athlete.metrics&&athlete.metrics[station.key])||station.metrics.map(()=>"");
            const av=stationAvg(athlete.metrics,station.key);
            return(
              <div key={station.key} style={{marginBottom:12}}>
                <div style={{fontSize:11,color:"#78909c",fontWeight:600,marginBottom:6,display:"flex",justifyContent:"space-between"}}>
                  <span>{station.label}</span>
                  {av!==null&&<span style={{color:"#66bb6a"}}>Avg: {av.toFixed(1)}</span>}
                </div>
                <div style={{display:"grid",gridTemplateColumns:`repeat(${station.metrics.length},1fr)`,gap:8}}>
                  {station.metrics.map((lbl,idx)=>(
                    <div key={idx}>
                      <div style={{fontSize:10,color:"#546e7a",marginBottom:2}}>{lbl}</div>
                      <input type="number" value={vs[idx]||""} disabled={locked}
                        onChange={e=>{const nv=[...vs];nv[idx]=e.target.value;onChange(athlete.id,{metrics:{...athlete.metrics,[station.key]:nv}});}}
                        style={{width:"100%",padding:"5px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:4,color:"#e8eaed",fontSize:13,textAlign:"center"}}/>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
          {sc&&<div style={{textAlign:"right",fontWeight:800,fontSize:15,color:"#66bb6a"}}>Total Score: {sc}</div>}
        </div>

        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {!locked&&<Btn onClick={()=>{onEmail(athlete);onClose();}} color="#42a5f5"><span role="img" aria-label="Mailbox">📬</span> Send Offer</Btn>}
          {!locked&&!athlete.hidden&&<Btn onClick={()=>{onHide(athlete);onClose();}} danger outline>Hide</Btn>}
          {athlete.hidden&&<Btn onClick={()=>{onUnhide(athlete.id);onClose();}} color="#66bb6a">Unhide</Btn>}
          {athlete.status==="accepted"&&<Badge c="#66bb6a"><span role="img" aria-label="Locked">🔒</span> Accepted — Locked</Badge>}
        </div>
      </div>
    </div>
  );
}

// ── EMAIL MODAL ─────────────────────────────────────────────────────
function EmailModal({athlete,team,onClose,onSend}){
  const tpl=`Hello,\n\nWe are pleased to offer ${athlete?.first||""} ${athlete?.last||""} a roster spot on Mid TN VBC${team?` — ${team}`:""} for the 2026-2027 season.\n\nDetails on cost, schedule, and coaching staff are available at www.midtnvbc.com/clubtryouts.\n\nPlease reply with one of the following:\n  1. Accept\n  2. Request a call to discuss\n  3. Decline\n\nThank you!\nMid TN VBC Administration`;
  const [body,setBody]=useState(tpl);
  const [copied,setCopied]=useState(false);
  useEffect(()=>{if(athlete){setBody(tpl);setCopied(false);}},[athlete?.id]);
  if(!athlete) return null;
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"#000b",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#1a1d24",border:"1px solid #2a2e38",borderRadius:14,padding:28,width:580,maxHeight:"90vh",overflow:"auto"}}>
        <h3 style={{margin:"0 0 4px",color:"#e8eaed",fontSize:16}}>Send Offer — {athlete.first} {athlete.last}</h3>
        {team&&<p style={{margin:"0 0 4px",fontSize:12,color:"#f0a500",fontWeight:600}}>{team}</p>}
        <p style={{margin:"0 0 16px",fontSize:12,color:"#78909c"}}>{athlete.email||<><span role="img" aria-label="Warning">⚠️</span> No email on file</>}</p>
        <textarea value={body} onChange={e=>setBody(e.target.value)} rows={13}
          style={{width:"100%",padding:12,background:"#12151c",border:"1px solid #2a2e38",borderRadius:8,color:"#e8eaed",fontSize:13,lineHeight:1.6,resize:"vertical"}}/>
        <div style={{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}}>
          <Btn onClick={onClose} color="#2a2e38">Cancel</Btn>
          <Btn onClick={()=>{navigator.clipboard?.writeText(body); setCopied(true); setTimeout(()=>setCopied(false),2000);}} color="#ffa726" outline aria-live="polite">
            {copied ? "✓ Copied!" : "Copy Text"}
          </Btn>
          <Btn onClick={()=>{navigator.clipboard?.writeText(body);setCopied(true);setTimeout(()=>setCopied(false),2000);}} color="#ffa726" outline>{copied?"✓ Copied":"Copy Text"}</Btn>
          <Btn onClick={()=>{onSend(athlete,body,team);onClose();}} color="#66bb6a" style={{flex:1}}>
            {athlete.email?"Open Mail App ✓":"Copy & Mark Contacted"}
          </Btn>
        </div>
      </div>
    </div>
  );
}

// ── PLAYER CARD ─────────────────────────────────────────────────────
function PlayerCard({athlete,onClick,compact,showScore,teamKey}){
  const sc=totalScore(athlete.metrics);
  const isWontAccept=athlete.wontAccept&&teamKey&&athlete.wontAccept.toLowerCase().includes(teamKey.split("-")[1]?.toLowerCase()||"___");
  const locked=athlete.teamLocked||athlete.status==="accepted";
  return(
    <div draggable={!locked} onDragStart={e=>!locked&&e.dataTransfer.setData("text/plain",athlete.id)}
      onClick={()=>onClick?.(athlete)}
      style={{padding:compact?"5px 8px":"9px 12px",margin:"3px 0",background:athlete.status==="declined"?"#2a1215":"#1a1d24",
        border:`1px solid ${locked?"#f0a50044":athlete.status==="declined"?"#ef535033":"#2a2e38"}`,
        borderRadius:7,cursor:locked?"default":"grab",display:"flex",alignItems:"center",gap:7,
        transition:"all .15s",opacity:athlete.hidden?0:.5>0&&athlete.status==="declined"?.55:1}}>
      {locked&&<span title="Locked" role="img" aria-label="Locked">🔒</span>}
      {locked&&<span role="img" aria-label="Locked" title="Locked">🔒</span>}
      <span style={{fontFamily:"monospace",fontSize:10,color:"#4fc3f7",minWidth:24}}>#{athlete.to}</span>
      <span style={{fontWeight:600,fontSize:compact?12:13,color:"#e8eaed",flex:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{athlete.first} {athlete.last}</span>
      <Badge c="#78909c" sm>{posAbbr(athlete.primaryPos)}</Badge>
      {athlete.altPos&&athlete.altPos!==athlete.primaryPos&&<Badge c="#3a3f47" sm>{posAbbr(athlete.altPos)}</Badge>}
      {athlete.wontAccept&&<span title={athlete.wontAccept} style={{fontSize:13}} role="img" aria-label="Team Restriction Alert">⚠️</span>}
      {athlete.notes&&<span title={athlete.notes} style={{fontSize:12,cursor:"help"}} role="img" aria-label="Has Notes">📝</span>}
      {athlete.wontAccept&&<span role="img" aria-label="Warning" title={athlete.wontAccept} style={{fontSize:13}}>⚠️</span>}
      {athlete.notes&&<span role="img" aria-label="Notes" title={athlete.notes} style={{fontSize:12,cursor:"help"}}>📝</span>}
      {showScore&&sc&&<Badge c={Number(sc)>=7?"#66bb6a":Number(sc)>=5?"#ffa726":"#ef5350"}>{sc}</Badge>}
      <StatusBadge status={athlete.status}/>
    </div>
  );
}

// ── RESULTS TABLE ───────────────────────────────────────────────────
function ResultsView({athletes,activeAge,onSelect,updateMetric}){
  const [sort,setSort]=useState("score");
  const list=useMemo(()=>{
    const a=athletes.filter(x=>x.ageGroup===activeAge&&!x.hidden);
    if(sort==="score") a.sort((x,y)=>(Number(totalScore(y.metrics))||0)-(Number(totalScore(x.metrics))||0));
    else if(sort==="name") a.sort((x,y)=>x.last.localeCompare(y.last));
    else a.sort((x,y)=>(stationAvg(y.metrics,sort)||0)-(stationAvg(x.metrics,sort)||0));
    return a;
  },[athletes,activeAge,sort]);

  const th={padding:"7px 6px",textAlign:"left",color:"#78909c",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,whiteSpace:"nowrap",borderBottom:"2px solid #2a2e38"};
  const td={padding:"5px 6px",verticalAlign:"middle",borderBottom:"1px solid #1a1d24"};
  return(
    <div>
      <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:14,flexWrap:"wrap"}}>
        <h2 style={{margin:0,fontSize:17,fontWeight:700}}>{activeAge}'s Results</h2>
        <select value={sort} onChange={e=>setSort(e.target.value)} style={{padding:"4px 8px",background:"#1a1d24",border:"1px solid #2a2e38",borderRadius:6,color:"#e8eaed",fontSize:12}}>
          <option value="score">Sort: Total Score</option>
          <option value="name">Sort: Name</option>
          {STATIONS.filter(s=>!s.isCheckin).map(s=><option key={s.key} value={s.key}>Sort: {s.label}</option>)}
        </select>
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr>
            <th style={th}>TO#</th><th style={th}>Name</th><th style={th}>POS</th><th style={th}>Alt</th>
            {STATIONS.filter(s=>!s.isCheckin).map(s=>s.metrics.map((m,i)=><th key={s.key+i} style={{...th,color:"#4fc3f7"}}>{m}</th>))}
            {STATIONS.filter(s=>!s.isCheckin).map(s=><th key={s.key+"a"} style={{...th,color:"#ffa726"}}>Avg</th>)}
            <th style={{...th,color:"#66bb6a"}}>Total</th><th style={th}>Status</th>
          </tr></thead>
          <tbody>
            {list.map((a,ri)=>{const sc=totalScore(a.metrics);return(
              <tr key={a.id} onClick={()=>onSelect(a)} style={{cursor:"pointer",background:ri%2===0?"transparent":"#0d1017"}}
                onMouseEnter={e=>e.currentTarget.style.background="#1a1d24"} onMouseLeave={e=>e.currentTarget.style.background=ri%2===0?"transparent":"#0d1017"}>
                <td style={{...td,fontFamily:"monospace",color:"#4fc3f7"}}>{a.to}</td>
                <td style={{...td,fontWeight:600}}>{a.first} {a.last}{a.isWalkup&&<span style={{marginLeft:6,fontSize:10,color:"#ffa726"}}>WU</span>}</td>
                <td style={td}><Badge c="#78909c" sm>{posAbbr(a.primaryPos)}</Badge></td>
                <td style={td}><Badge c="#546e7a" sm>{posAbbr(a.altPos)}</Badge></td>
                {STATIONS.filter(s=>!s.isCheckin).map(station=>station.metrics.map((m,idx)=>{
                  const vs=(a.metrics&&a.metrics[station.key])||[];
                  return<td key={station.key+idx} style={td}>
                    <input type="number" value={vs[idx]||""} onClick={e=>e.stopPropagation()}
                      onChange={e=>{const nv=[...(a.metrics?.[station.key]||station.metrics.map(()=>""))];nv[idx]=e.target.value;updateMetric(a.id,station.key,nv);}}
                      style={{width:52,padding:"3px 4px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:4,color:"#e8eaed",fontSize:12,textAlign:"center"}}/>
                  </td>;
                }))}
                {STATIONS.filter(s=>!s.isCheckin).map(s=>{const av=stationAvg(a.metrics,s.key);return<td key={s.key+"a"} style={{...td,color:"#ffa726",fontWeight:700,fontFamily:"monospace"}}>{av!==null?av.toFixed(1):"—"}</td>;})}
                <td style={{...td,fontWeight:800,fontFamily:"monospace"}}>
                  {sc?<span style={{color:Number(sc)>=7?"#66bb6a":Number(sc)>=5?"#ffa726":"#ef5350"}}>{sc}</span>:<span style={{color:"#333"}}>—</span>}
                </td>
                <td style={td}><StatusBadge status={a.status}/></td>
              </tr>
            );})}
          </tbody>
        </table>
        {list.length===0&&<div style={{padding:40,textAlign:"center",color:"#444"}}>No athletes in {activeAge}s</div>}
      </div>
    </div>
  );
}

// ── DEPTH CHART ─────────────────────────────────────────────────────
function DepthChartView({athletes,activeAge,onSelect}){
  const pool=athletes.filter(a=>a.ageGroup===activeAge&&!a.hidden);
  const grouped={setter:[],middle:[],outside:[],defense:[],unsorted:[]};
  pool.forEach(a=>(grouped[a.posCategory]||grouped.unsorted).push(a));
  Object.keys(grouped).forEach(k=>grouped[k].sort((a,b)=>(Number(totalScore(b.metrics))||0)-(Number(totalScore(a.metrics))||0)));

  return(
    <div>
      <h2 style={{fontSize:17,fontWeight:700,margin:"0 0 14px"}}>{activeAge}'s Depth Chart <span style={{fontSize:13,color:"#78909c",fontWeight:400}}>— sorted by score, primary pos · alt pos shown</span></h2>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:16}}>
        {[...POS_CATS,{key:"unsorted",label:"Unsorted / Unsure"}].map(cat=>{
          const list=grouped[cat.key]||[];
          return(
            <div key={cat.key} style={{background:"#12151c",borderRadius:12,border:"1px solid #1e222b",overflow:"hidden"}}>
              <div style={{padding:"10px 14px",background:"#1a1d24",borderBottom:"1px solid #1e222b",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontWeight:700,fontSize:13,color:cat.key==="unsorted"?"#ffa726":"#4fc3f7"}}>{cat.label}</span>
                <span style={{fontSize:11,color:"#546e7a"}}>{list.length}</span>
              </div>
              <div style={{padding:8,maxHeight:480,overflowY:"auto"}}>
                {list.map((a,i)=>(
                  <div key={a.id} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 8px",background:"#1a1d24",borderRadius:6,marginBottom:4,cursor:"pointer"}} onClick={()=>onSelect(a)}>
                    <span style={{fontSize:11,color:"#546e7a",minWidth:16,textAlign:"right"}}>{i+1}</span>
                    <span style={{fontFamily:"monospace",fontSize:10,color:"#4fc3f7",minWidth:24}}>#{a.to}</span>
                    <span style={{flex:1,fontSize:12,fontWeight:600}}>{a.first} {a.last}</span>
                    <Badge c="#546e7a" sm>{posAbbr(a.altPos)}</Badge>
                    {totalScore(a.metrics)&&<Badge c={Number(totalScore(a.metrics))>=7?"#66bb6a":Number(totalScore(a.metrics))>=5?"#ffa726":"#ef5350"} sm>{totalScore(a.metrics)}</Badge>}
                    {a.wontAccept&&<span title={a.wontAccept} role="img" aria-label="Team Restriction Alert">⚠️</span>}
                    {a.notes&&<span title={a.notes} role="img" aria-label="Has Notes">📝</span>}
                    {a.wontAccept&&<span role="img" aria-label="Warning" title={a.wontAccept}>⚠️</span>}
                    {a.notes&&<span role="img" aria-label="Notes" title={a.notes}>📝</span>}
                  </div>
                ))}
                {list.length===0&&<div style={{padding:20,textAlign:"center",color:"#333",fontSize:12}}>None</div>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── TEAM BUILDER ─────────────────────────────────────────────────────
function TeamBuilderView({athletes,activeAge,onChange,onSelect,onEmail}){
  const [poolSort,setPoolSort]=useState("score");
  const [showPool,setShowPool]=useState(true);
  const ageAthletes=athletes.filter(a=>a.ageGroup===activeAge&&!a.hidden);
  const pool=useMemo(()=>{
    let l=ageAthletes.filter(a=>!a.teamAssignment);
    if(poolSort==="score") l.sort((a,b)=>(Number(totalScore(b.metrics))||0)-(Number(totalScore(a.metrics))||0));
    else if(poolSort==="name") l.sort((a,b)=>a.last.localeCompare(b.last));
    else l.sort((a,b)=>(a.posCategory||"z").localeCompare(b.posCategory||"z"));
    return l;
  },[ageAthletes,poolSort]);

  const drop=(e,teamKey)=>{
    e.preventDefault();
    const id=e.dataTransfer.getData("text/plain");
    const a=athletes.find(x=>x.id===id);
    if(a&&!a.teamLocked&&a.status!=="accepted") onChange(id,{teamAssignment:teamKey});
  };

  return(
    <div style={{display:"flex",gap:16,alignItems:"flex-start"}}>
      {/* Pool */}
      {showPool&&(
        <div style={{width:280,flexShrink:0,background:"#12151c",borderRadius:12,border:"1px solid #1e222b",maxHeight:"calc(100vh - 180px)",display:"flex",flexDirection:"column"}}>
          <div style={{padding:"10px 14px",borderBottom:"1px solid #1e222b"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontWeight:700,fontSize:13,color:"#e8eaed"}}>Pool <span style={{color:"#546e7a",fontWeight:400}}>({pool.length})</span></span>
              <select value={poolSort} onChange={e=>setPoolSort(e.target.value)} style={{padding:"2px 6px",background:"#0d1017",border:"1px solid #2a2e38",borderRadius:4,color:"#e8eaed",fontSize:11}}>
                <option value="score">By Score</option><option value="pos">By Position</option><option value="name">By Name</option>
              </select>
            </div>
            <div style={{fontSize:11,color:"#546e7a"}}>Drag into teams below ↓</div>
          </div>
          <div style={{overflow:"auto",flex:1,padding:8}}>
            {pool.map(a=><PlayerCard key={a.id} athlete={a} onClick={onSelect} compact showScore/>)}
            {pool.length===0&&<div style={{padding:30,textAlign:"center",color:"#444",fontSize:12}}>All athletes assigned</div>}
          </div>
        </div>
      )}
      {/* Teams */}
      <div style={{flex:1}}>
        <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:14,flexWrap:"wrap"}}>
          <h2 style={{margin:0,fontSize:17,fontWeight:700}}>{activeAge}'s Teams</h2>
          <Btn sm onClick={()=>setShowPool(p=>!p)} color="#2a2e38" outline>{showPool?"Hide Pool":"Show Pool"}</Btn>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(290px,1fr))",gap:14}}>
          {SKILL_LEVELS.map(lvl=>{
            const key=`${activeAge}-${lvl}`;
            const ts=TEAM_STYLE[lvl];
            const roster=ageAthletes.filter(a=>a.teamAssignment===key);
            const locked=roster.length>0&&roster.every(a=>a.teamLocked);
            const active=roster.filter(a=>a.status!=="declined");
            const declined=roster.filter(a=>a.status==="declined");
            return(
              <div key={lvl} style={{background:ts.bg,borderRadius:12,border:`2px solid ${locked?"#f0a500":ts.border}`,overflow:"hidden",transition:"border-color .2s"}}>
                <div style={{padding:"10px 14px",background:ts.header,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    {locked&&<span role="img" aria-label="Locked">🔒</span>}
                    <span style={{fontWeight:800,fontSize:14,color:ts.text}}>{activeAge} {lvl}</span>
                    <span style={{fontSize:11,color:"rgba(255,255,255,.5)",background:"rgba(255,255,255,.1)",padding:"2px 7px",borderRadius:10}}>{roster.length}/12</span>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    {roster.length>0&&(
                      <Btn sm onClick={()=>{
                        const newLocked=!locked;
                        roster.forEach(a=>onChange(a.id,{teamLocked:newLocked}));
                      }} color={locked?"#ef5350":"#f0a500"} outline>
                        {locked?<><span role="img" aria-label="Unlock">🔓</span> Unlock</>:<><span role="img" aria-label="Locked">🔒</span> Finalize</>}
                        {locked?<><span role="img" aria-label="Unlocked">🔓</span> Unlock</>:<><span role="img" aria-label="Locked">🔒</span> Finalize</>}
                      </Btn>
                    )}
                  </div>
                </div>
                <div onDragOver={e=>e.preventDefault()} onDrop={e=>!locked&&drop(e,key)}
                  style={{padding:10,minHeight:120,opacity:locked?.85:1}}>
                  {active.length===0&&declined.length===0&&(
                    <div style={{padding:24,textAlign:"center",color:"#555",fontSize:12,border:"2px dashed #333",borderRadius:8}}>
                      {locked?"Team locked":"Drop athletes here"}
                    </div>
                  )}
                  {active.map(a=>(
                    <div key={a.id} style={{position:"relative"}}>
                      <PlayerCard athlete={a} onClick={onSelect} compact showScore teamKey={key}/>
                      {!locked&&<button onClick={()=>onChange(a.id,{teamAssignment:null,teamLocked:false})}
                        aria-label="Remove from team"
                        style={{position:"absolute",right:4,top:"50%",transform:"translateY(-50%)",background:"#ef535033",border:"none",borderRadius:4,color:"#ef5350",cursor:"pointer",fontSize:10,padding:"2px 5px"}}>×</button>}
                    </div>
                  ))}
                  {declined.length>0&&(
                    <div style={{marginTop:8,borderTop:"1px solid rgba(255,255,255,.1)",paddingTop:8}}>
                      <div style={{fontSize:10,color:"#ef5350",fontWeight:700,marginBottom:4,textTransform:"uppercase"}}>Declined ({declined.length})</div>
                      {declined.map(a=><PlayerCard key={a.id} athlete={a} onClick={onSelect} compact teamKey={key}/>)}
                    </div>
                  )}
                </div>
                {roster.length>0&&(
                  <div style={{padding:"8px 10px",borderTop:`1px solid ${ts.border}44`}}>
                    <Btn sm onClick={()=>{
                      const uncontacted=roster.filter(a=>!["offered","accepted","declined"].includes(a.status));
                      if(uncontacted.length>0) onEmail(uncontacted[0],key);
                    }} color={ts.header} style={{width:"100%",background:ts.header,border:`1px solid ${ts.border}88`}}>
                      📬 Send Offers ({roster.filter(a=>!["offered","accepted","declined"].includes(a.status)).length} pending)
                    </Btn>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── ALL REG TABLE ───────────────────────────────────────────────────
function AllRegView({athletes,onSelect,onArrive,onAddWalkup}){
  const [search,setSearch]=useState("");
  const [addingWalkup,setAddingWalkup]=useState(false);
  const [wu,setWu]=useState({first:"",last:"",division:"12 & Under",primaryPos:"Outside Hitter",altPos:"",phone:"",email:"",dob:""});
  const list=useMemo(()=>{
    let l=athletes.filter(a=>!a.hidden);
    if(search){const s=search.toLowerCase();l=l.filter(a=>a.first.toLowerCase().includes(s)||a.last.toLowerCase().includes(s)||a.to.includes(search)||(a.division||"").toLowerCase().includes(s)||(a.primaryPos||"").toLowerCase().includes(s));}
    return l;
  },[athletes,search]);

  const submitWalkup=()=>{
    if(!wu.first||!wu.last) return;
    onAddWalkup({...wu,to:nextTO(athletes),isWalkup:true,arrived:true,status:"arrived",id:`wu-${Date.now()}`});
    setWu({first:"",last:"",division:"12 & Under",primaryPos:"Outside Hitter",altPos:"",phone:"",email:"",dob:""});
    setAddingWalkup(false);
  };

  const th={padding:"7px 8px",textAlign:"left",color:"#78909c",fontSize:10,fontWeight:700,textTransform:"uppercase",background:"#12151c",position:"sticky",top:0,borderBottom:"1px solid #2a2e38"};
  const td={padding:"6px 8px",verticalAlign:"middle",borderBottom:"1px solid #1a1d24",fontSize:12};
  const arrived=list.filter(a=>a.arrived).length;
  const walkups=list.filter(a=>a.isWalkup).length;

  return(
    <div>
      <div style={{display:"flex",gap:10,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, TO#, position, division..."
          style={{flex:1,minWidth:220,padding:"7px 12px",background:"#1a1d24",border:"1px solid #2a2e38",borderRadius:8,color:"#e8eaed",fontSize:13}}/>
        <Badge c="#26c6da">{arrived} Arrived</Badge>
        <Badge c="#ffa726">{walkups} Walkups</Badge>
        <Badge c="#78909c">{list.length} Total</Badge>
        <Btn sm onClick={()=>setAddingWalkup(p=>!p)} color="#f0a500">+ Add Walkup</Btn>
        <Btn sm onClick={()=>exportAllRegCSV(athletes)} color="#4fc3f7" outline>Export CSV</Btn>
      </div>

      {addingWalkup&&(
        <div style={{background:"#1a1d24",border:"1px solid #f0a50033",borderRadius:10,padding:16,marginBottom:14}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:10}}>
            {[["First *","first"],["Last *","last"],["DOB","dob"],["Phone","phone"],["Email","email"]].map(([l,k])=>(
              <div key={k}>
                <label style={{fontSize:10,color:"#78909c",display:"block",marginBottom:3}}>{l}</label>
                <input value={wu[k]||""} onChange={e=>setWu(p=>({...p,[k]:e.target.value}))} style={{width:"100%",padding:"6px 8px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:5,color:"#e8eaed",fontSize:12}}/>
              </div>
            ))}
            <div>
              <label style={{fontSize:10,color:"#78909c",display:"block",marginBottom:3}}>Division *</label>
              <select value={wu.division} onChange={e=>setWu(p=>({...p,division:e.target.value}))} style={{width:"100%",padding:"6px 8px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:5,color:"#e8eaed",fontSize:12}}>
                {AGE_GROUPS.map(a=><option key={a} value={`${a} & Under`}>{a}s</option>)}
              </select>
            </div>
            <div>
              <label style={{fontSize:10,color:"#78909c",display:"block",marginBottom:3}}>Primary Pos *</label>
              <select value={wu.primaryPos} onChange={e=>setWu(p=>({...p,primaryPos:e.target.value}))} style={{width:"100%",padding:"6px 8px",background:"#12151c",border:"1px solid #2a2e38",borderRadius:5,color:"#e8eaed",fontSize:12}}>
                {["Outside Hitter","Middle Hitter","Setter","Right Side Hitter","Defensive Specialist","Libero","I am unsure"].map(p=><option key={p}>{p}</option>)}
              </select>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <Btn sm onClick={()=>setAddingWalkup(false)} color="#2a2e38">Cancel</Btn>
            <Btn sm onClick={submitWalkup} color="#f0a500" disabled={!wu.first||!wu.last}>Add & Check In ✓</Btn>
          </div>
        </div>
      )}

      <div style={{overflowX:"auto",maxHeight:"calc(100vh - 280px)"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr>
            {["TO#","Name","Div","Primary","Alt","Coach","Score","Status","Arrived","Notes","Phone","Email"].map(h=><th key={h} style={th}>{h}</th>)}

          <tbody>
            {list.map(a=>(
              <tr key={a.id} onClick={()=>onSelect(a)} style={{cursor:"pointer"}}

                <td style={{...td,fontFamily:"monospace",color:"#4fc3f7"}}>{a.to}</td>
                <td style={{...td,fontWeight:600,whiteSpace:"nowrap"}}>{a.first} {a.last}{a.isWalkup&&<span style={{marginLeft:5,fontSize:10,color:"#ffa726"}}>WU</span>}</td>
                <td style={td}><Badge c="#78909c" sm>{a.ageGroup}s</Badge></td>

                <td style={{...td,fontFamily:"monospace",fontWeight:700}}>{totalScore(a.metrics)||"—"}</td>
                <td style={td}><StatusBadge status={a.status}/></td>
                <td style={td}>{a.arrived?<Badge c="#26c6da" sm>✓</Badge>:<Btn sm onClick={e=>{e.stopPropagation();onArrive(a.id);}} color="#26c6da" outline>Check In</Btn>}</td>
                <td style={td}>{a.notes&&<span title={a.notes} style={{cursor:"help"}} role="img" aria-label="Has Notes">📝</span>}{a.wontAccept&&<span title={a.wontAccept} style={{cursor:"help",marginLeft:4}} role="img" aria-label="Team Restriction Alert">⚠️</span>}</td>
                <td style={td}>{a.notes&&<span role="img" aria-label="Notes" title={a.notes} style={{cursor:"help"}}>📝</span>}{a.wontAccept&&<span role="img" aria-label="Warning" title={a.wontAccept} style={{cursor:"help",marginLeft:4}}>⚠️</span>}</td>
                <td style={{...td,color:"#78909c",whiteSpace:"nowrap"}}>{a.phone}</td>
                <td style={{...td,color:"#78909c",maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.email}</td>
              </tr>
            ))}
          </tbody>
        </table>
        {list.length===0&&<div style={{padding:40,textAlign:"center",color:"#444"}}>No results</div>}
      </div>
    </div>
  );
}
